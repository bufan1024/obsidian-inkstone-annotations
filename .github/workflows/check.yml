name: Plugin checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and verify committed artifacts
        run: |
          npm run build
          git diff --exit-code -- main.js styles.css
      - name: Test annotations
        run: npm test
